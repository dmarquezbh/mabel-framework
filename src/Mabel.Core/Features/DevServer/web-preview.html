<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Mabel Web Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #container { width: 100%; height: 100%; display: flex; flex-direction: column; }

  /* Toolbar */
  #toolbar {
    background: #16213e; color: #e0e0e0; padding: 8px 16px;
    display: flex; align-items: center; gap: 10px; font-size: 13px;
    border-bottom: 1px solid #0f3460; flex-shrink: 0;
  }
  #toolbar .logo { font-weight: 700; color: #e94560; font-size: 15px; }
  #toolbar .status { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  #toolbar .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
  #toolbar .dot.connected { background: #4ecca3; }
  #toolbar .dot.disconnected { background: #e94560; }
  .btn {
    background: #0f3460; color: #e0e0e0; border: 1px solid #1a4a8a; border-radius: 4px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: #1a4a8a; }
  .btn.active { background: #e94560; border-color: #e94560; }

  /* Main area */
  #main { flex: 1; display: flex; overflow: hidden; }

  /* Preview panel */
  #preview-panel { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #111; }
  canvas { background: #fff; touch-action: none; }

  /* Editor panel */
  #editor-panel {
    width: 0; overflow: hidden; display: flex; flex-direction: column;
    background: #1e1e2e; border-left: 1px solid #0f3460;
    transition: width 0.2s ease;
  }
  #editor-panel.open { width: 50%; }
  @media (max-width: 768px) {
    #editor-panel.open { width: 100%; }
    #editor-panel.open + #preview-panel,
    #main.editor-active #preview-panel { display: none; }
  }

  /* File tabs */
  #file-tabs {
    display: flex; gap: 0; background: #16213e; overflow-x: auto; flex-shrink: 0;
    border-bottom: 1px solid #0f3460;
  }
  .tab {
    padding: 6px 14px; font-size: 12px; color: #888; cursor: pointer;
    border-right: 1px solid #0f3460; white-space: nowrap;
  }
  .tab:hover { color: #ccc; }
  .tab.active { color: #e94560; background: #1e1e2e; }

  /* Code editor */
  #code-editor {
    flex: 1; background: #1e1e2e; color: #d4d4d4; border: none; outline: none;
    font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px; line-height: 1.5; padding: 12px; resize: none;
    tab-size: 4; overflow: auto;
  }

  /* Editor footer */
  #editor-footer {
    background: #16213e; padding: 6px 12px; display: flex; align-items: center; gap: 8px;
    border-top: 1px solid #0f3460; flex-shrink: 0;
  }
  #editor-footer .hint { color: #666; font-size: 11px; margin-left: auto; }
  #save-status { font-size: 12px; color: #4ecca3; }

  /* Overlay */
  #overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; text-align: center; padding: 20px; z-index: 100;
  }
  #overlay.hidden { display: none; }
  #overlay .spinner { margin-bottom: 16px; font-size: 32px; animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Build log */
  #build-log {
    display: none; background: #0d0d1a; color: #4ecca3; font-family: monospace;
    font-size: 11px; padding: 8px 12px; max-height: 80px; overflow-y: auto;
    border-top: 1px solid #0f3460; flex-shrink: 0;
  }
  #build-log.visible { display: block; }
</style>
</head>
<body>
<div id="container">
  <div id="toolbar">
    <span class="logo">Mabel</span>
    <span id="info">Vibe Coding</span>
    <button class="btn" id="btn-editor" title="Toggle editor">Code</button>
    <button class="btn" id="btn-files" title="Refresh file list">Files</button>
    <span class="status">
      <span id="build-label">v0</span>
      <span id="status-dot" class="dot disconnected"></span>
    </span>
  </div>
  <div id="main">
    <div id="editor-panel">
      <div id="file-tabs"></div>
      <textarea id="code-editor" spellcheck="false" placeholder="Select a file to edit..."></textarea>
      <div id="editor-footer">
        <button class="btn" id="btn-save" title="Ctrl+S">Save</button>
        <span id="save-status"></span>
        <span class="hint">Ctrl+S to save &amp; rebuild</span>
      </div>
    </div>
    <div id="preview-panel">
      <canvas id="canvas"></canvas>
    </div>
  </div>
  <div id="build-log"></div>
</div>
<div id="overlay"><div><div class="spinner">&#9881;</div><br/>Connecting to Mabel Dev Server...</div></div>

<script>
(function() {
  'use strict';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const statusDot = document.getElementById('status-dot');
  const buildLabel = document.getElementById('build-label');
  const editorPanel = document.getElementById('editor-panel');
  const codeEditor = document.getElementById('code-editor');
  const fileTabs = document.getElementById('file-tabs');
  const saveStatus = document.getElementById('save-status');
  const buildLog = document.getElementById('build-log');
  const btnEditor = document.getElementById('btn-editor');
  const btnFiles = document.getElementById('btn-files');
  const btnSave = document.getElementById('btn-save');

  let currentFile = null;
  let fileList = [];
  let editorOpen = false;

  // -- Responsive canvas sizing (mobile friendly) --
  function resizeCanvas() {
    const wrap = document.getElementById('preview-panel');
    if (!wrap.clientWidth) return;
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', function() { resizeCanvas(); renderDemo(); });
  resizeCanvas();

  // -- RGBA uint32 (0xRRGGBBAA) to CSS --
  function rgbaToCSS(c) {
    const r = (c >>> 24) & 0xFF;
    const g = (c >>> 16) & 0xFF;
    const b = (c >>> 8) & 0xFF;
    const a = (c & 0xFF) / 255;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(3) + ')';
  }

  // -- RenderOp constants (must match Protocol.cs) --
  const Op = {
    Rect: 0x01, RoundRect: 0x02, Circle: 0x03, Line: 0x04, Text: 0x05, Image: 0x06,
    Shadow: 0x07, Blur: 0x08, LinearGrad: 0x09, RadialGrad: 0x0A, Stroke: 0x0B, Path: 0x0C,
    PushClip: 0x10, PopClip: 0x11, PushOpacity: 0x12, PopOpacity: 0x13,
    Translate: 0x14, Scale: 0x15, Rotate: 0x16,
    BeginFrame: 0xF0, EndFrame: 0xF1
  };

  // -- Renderer state --
  let currentGradient = null;
  const stateStack = [];

  function getFill(fallbackColor) {
    if (currentGradient) { const g = currentGradient; currentGradient = null; return g; }
    return rgbaToCSS(fallbackColor);
  }

  function renderCommands(commands) {
    for (const cmd of commands) {
      switch (cmd.op) {
        case Op.BeginFrame:
          ctx.save(); ctx.fillStyle = rgbaToCSS(cmd.color);
          ctx.fillRect(0, 0, canvas.width, canvas.height); break;
        case Op.Rect:
          ctx.fillStyle = getFill(cmd.color); ctx.fillRect(cmd.x, cmd.y, cmd.w, cmd.h); break;
        case Op.RoundRect:
          ctx.fillStyle = getFill(cmd.color); ctx.beginPath();
          roundRect(ctx, cmd.x, cmd.y, cmd.w, cmd.h, cmd.radius); ctx.fill(); break;
        case Op.Circle:
          ctx.fillStyle = getFill(cmd.color); ctx.beginPath();
          ctx.arc(cmd.x, cmd.y, cmd.radius, 0, Math.PI * 2); ctx.fill(); break;
        case Op.Line:
          ctx.strokeStyle = rgbaToCSS(cmd.color); ctx.lineWidth = cmd.fontSize || 1;
          ctx.beginPath(); ctx.moveTo(cmd.x, cmd.y); ctx.lineTo(cmd.w, cmd.h); ctx.stroke(); break;
        case Op.Text:
          ctx.fillStyle = rgbaToCSS(cmd.color);
          ctx.font = cmd.fontSize + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          ctx.textBaseline = 'top'; ctx.fillText(cmd.text || '', cmd.x, cmd.y); break;
        case Op.Image: drawImage(cmd.text, cmd.x, cmd.y, cmd.w, cmd.h); break;
        case Op.Shadow:
          ctx.shadowOffsetX = cmd.x; ctx.shadowOffsetY = cmd.y;
          ctx.shadowBlur = cmd.radius; ctx.shadowColor = rgbaToCSS(cmd.color); break;
        case Op.Blur:
          ctx.filter = cmd.radius > 0 ? 'blur(' + cmd.radius + 'px)' : 'none'; break;
        case Op.LinearGrad: {
          const lg = ctx.createLinearGradient(cmd.x, cmd.y, cmd.w, cmd.h);
          lg.addColorStop(0, rgbaToCSS(cmd.color)); lg.addColorStop(1, rgbaToCSS(cmd.color2));
          currentGradient = lg; break; }
        case Op.RadialGrad: {
          const rg = ctx.createRadialGradient(cmd.x, cmd.y, 0, cmd.x, cmd.y, cmd.radius);
          rg.addColorStop(0, rgbaToCSS(cmd.color)); rg.addColorStop(1, rgbaToCSS(cmd.color2));
          currentGradient = rg; break; }
        case Op.Stroke:
          ctx.strokeStyle = rgbaToCSS(cmd.color); ctx.lineWidth = cmd.fontSize || 1;
          ctx.beginPath(); roundRect(ctx, cmd.x, cmd.y, cmd.w, cmd.h, cmd.radius); ctx.stroke(); break;
        case Op.Path: {
          const p = new Path2D(cmd.text || ''); ctx.fillStyle = getFill(cmd.color); ctx.fill(p); break; }
        case Op.PushClip:
          ctx.save(); ctx.beginPath(); ctx.rect(cmd.x, cmd.y, cmd.w, cmd.h); ctx.clip(); break;
        case Op.PopClip: ctx.restore(); break;
        case Op.PushOpacity: stateStack.push(ctx.globalAlpha); ctx.globalAlpha *= cmd.x; break;
        case Op.PopOpacity: ctx.globalAlpha = stateStack.length > 0 ? stateStack.pop() : 1; break;
        case Op.Translate: ctx.translate(cmd.x, cmd.y); break;
        case Op.Scale: ctx.scale(cmd.x, cmd.y); break;
        case Op.Rotate: ctx.rotate(cmd.x); break;
        case Op.EndFrame: ctx.restore(); currentGradient = null; break;
      }
    }
  }

  function roundRect(c, x, y, w, h, r) {
    if (r <= 0) { c.rect(x, y, w, h); return; }
    r = Math.min(r, Math.min(w, h) / 2);
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  const imageCache = {};
  function drawImage(id, x, y, w, h) {
    if (!id) return;
    if (imageCache[id]) { ctx.drawImage(imageCache[id], x, y, w, h); return; }
    const img = new Image();
    img.onload = function() { imageCache[id] = img; };
    img.src = id;
  }

  // -- Touch/Pointer events --
  const InputType = { TouchDown: 0x01, TouchUp: 0x02, TouchMove: 0x03 };
  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] || e.changedTouches[0] : e;
    return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
  }
  canvas.addEventListener('pointerdown', function(e) { sendInput(InputType.TouchDown, getCanvasPos(e)); });
  canvas.addEventListener('pointermove', function(e) { if (e.buttons) sendInput(InputType.TouchMove, getCanvasPos(e)); });
  canvas.addEventListener('pointerup', function(e) { sendInput(InputType.TouchUp, getCanvasPos(e)); });

  let ws = null;
  function sendInput(type, p) {
    if (ws && ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify({ type: type, x: p.x, y: p.y }));
  }

  // -- Demo frame --
  function renderDemo() {
    resizeCanvas();
    const w = parseInt(canvas.style.width) || 400;
    const h = parseInt(canvas.style.height) || 700;
    renderCommands([
      { op: Op.BeginFrame, color: 0xFFFFFFFF },
      { op: Op.Rect, x: 0, y: 0, w: w, h: 56, color: 0xE94560FF },
      { op: Op.Text, x: 16, y: 16, text: 'Mabel Web Preview', fontSize: 22, color: 0xFFFFFFFF },
      { op: Op.Text, x: 16, y: 80, text: 'Aguardando dados do WASM...', fontSize: 16, color: 0x666666FF },
      { op: Op.Text, x: 16, y: 110, text: 'Edite um .razor e salve para ver o resultado.', fontSize: 14, color: 0x999999FF },
      { op: Op.RoundRect, x: 16, y: 160, w: w - 32, h: 100, radius: 12, color: 0xF0F0F0FF },
      { op: Op.Circle, x: 66, y: 210, radius: 30, color: 0x4ECCA3FF },
      { op: Op.Text, x: 110, y: 195, text: 'Componente de exemplo', fontSize: 15, color: 0x333333FF },
      { op: Op.Text, x: 110, y: 218, text: 'Canvas2D renderer', fontSize: 12, color: 0x999999FF },
      { op: Op.Stroke, x: 16, y: 280, w: w - 32, h: 60, radius: 8, color: 0xCCCCCCFF, fontSize: 2 },
      { op: Op.Text, x: w / 2 - 80, y: 300, text: 'Toque "Code" para editar', fontSize: 14, color: 0xAAAAAAAA },
      { op: Op.EndFrame }
    ]);
  }

  // ==========================================
  // VIBE CODING - Editor + API
  // ==========================================

  // Toggle editor panel
  btnEditor.addEventListener('click', function() {
    editorOpen = !editorOpen;
    editorPanel.classList.toggle('open', editorOpen);
    btnEditor.classList.toggle('active', editorOpen);
    if (editorOpen && fileList.length === 0) loadFileList();
    setTimeout(function() { resizeCanvas(); renderDemo(); }, 250);
  });

  btnFiles.addEventListener('click', loadFileList);

  // Load file list from API
  function loadFileList() {
    fetch('/api/files')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        fileList = data.files || [];
        renderTabs();
        if (fileList.length > 0 && !currentFile) openFile(fileList[0]);
      })
      .catch(function(err) { logBuild('Error loading files: ' + err); });
  }

  // Render file tabs
  function renderTabs() {
    fileTabs.innerHTML = '';
    fileList.forEach(function(f) {
      var tab = document.createElement('div');
      tab.className = 'tab' + (f === currentFile ? ' active' : '');
      tab.textContent = f.split('/').pop();
      tab.title = f;
      tab.addEventListener('click', function() { openFile(f); });
      fileTabs.appendChild(tab);
    });
  }

  // Open a file in the editor
  function openFile(filePath) {
    currentFile = filePath;
    renderTabs();
    saveStatus.textContent = 'Loading...';
    fetch('/api/file?path=' + encodeURIComponent(filePath))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        codeEditor.value = data.content || '';
        saveStatus.textContent = '';
      })
      .catch(function(err) {
        saveStatus.textContent = 'Error: ' + err;
      });
  }

  // Save current file via API
  function saveCurrentFile() {
    if (!currentFile) return;
    saveStatus.textContent = 'Saving...';
    fetch('/api/code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: currentFile, content: codeEditor.value })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        saveStatus.textContent = 'Saved! Rebuilding...';
        logBuild('Saved ' + currentFile + ' — waiting for rebuild...');
      } else {
        saveStatus.textContent = 'Error: ' + (data.error || 'unknown');
      }
    })
    .catch(function(err) {
      saveStatus.textContent = 'Error: ' + err;
    });
  }

  // Save button
  btnSave.addEventListener('click', saveCurrentFile);

  // Ctrl+S / Cmd+S
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveCurrentFile();
    }
  });

  // Tab key in editor
  codeEditor.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var start = this.selectionStart;
      var end = this.selectionEnd;
      this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
      this.selectionStart = this.selectionEnd = start + 4;
    }
  });

  // Build log
  function logBuild(msg) {
    buildLog.classList.add('visible');
    var time = new Date().toLocaleTimeString();
    buildLog.textContent = '[' + time + '] ' + msg;
  }

  // ==========================================
  // WebSocket connection
  // ==========================================
  function connect() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws');

    ws.onopen = function() {
      statusDot.className = 'dot connected';
      overlay.className = 'hidden';
      renderDemo();
    };

    ws.onmessage = function(e) {
      var data = e.data;
      if (typeof data === 'string' && data.startsWith('reload:')) {
        var v = data.split(':')[1];
        buildLabel.textContent = 'v' + v;
        saveStatus.textContent = 'Build v' + v + ' OK!';
        logBuild('Build v' + v + ' complete — preview updated');
        renderDemo();
        return;
      }
      try {
        var commands = JSON.parse(data);
        if (Array.isArray(commands)) { resizeCanvas(); renderCommands(commands); }
      } catch (err) { console.warn('[mabel]', err); }
    };

    ws.onclose = function() {
      statusDot.className = 'dot disconnected';
      setTimeout(connect, 2000);
    };

    ws.onerror = function() { ws.close(); };
  }

  connect();
})();
</script>
</body>
</html>
